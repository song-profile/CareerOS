server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:Lax}

spring:
  application:
    name: careerdock
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # 증명사진·성적증명서·포트폴리오 PDF 기준. 초과분은 서블릿이 먼저 끊어 FILE_ERROR로 나간다.
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      # 폼 필드까지 더한 요청 전체 한도. 파일 한도와 같게 두면 한도에 딱 맞는 파일이 필드 때문에 막힌다.
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:11MB}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dev-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - profile
              - email

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  file:
    # 업로드 본문 저장 위치. 운영에서는 컨테이너 밖 볼륨을 연결한다. 공개 웹 루트 아래에 두지 않는다.
    storage-path: ${FILE_STORAGE_PATH:./data/files}
  security:
    # 자격번호 AES-256-GCM 키. Base64로 인코딩한 32바이트 값이다.
    # 아래 기본값은 로컬 개발 전용이며 운영에서는 반드시 CREDENTIAL_ENCRYPTION_KEY로 주입한다.
    credential-encryption-key: ${CREDENTIAL_ENCRYPTION_KEY:Y2FyZWVyZG9jay1sb2NhbC1kZXYta2V5LTMyYnl0ZXM=}
  google:
    calendar:
      # 로그인과 별개의 콜백 경로. 같은 Google Cloud OAuth 클라이언트(GOOGLE_CLIENT_ID/SECRET)에
      # redirect URI만 추가로 등록해야 한다. {baseUrl} 치환은 Spring의 ClientRegistration 전용이라
      # 여기서는 쓸 수 없다 — 운영 배포 시 절대경로로 직접 주입한다.
      redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/calendar/oauth/callback}
      # Google Refresh/Access Token 저장용 AES-256-GCM 키. credential-encryption-key와 다른 키를
      # 써서, 한쪽 키가 유출되어도 다른 쪽 민감정보까지 함께 노출되지 않게 분리한다.
      token-encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY:Y2FyZWVyZG9jay1sb2NhbC10b2tlbi1rZXktMzJieXg=}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:3000}}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
      - Origin
    allow-credentials: true

logging:
  level:
    # google-api-client는 FINE 레벨에서 Authorization 헤더(Bearer 토큰)까지 그대로 찍는다.
    # 토큰을 절대 로그에 남기지 않기 위해 명시적으로 올려둔다.
    com.google.api.client: WARN
